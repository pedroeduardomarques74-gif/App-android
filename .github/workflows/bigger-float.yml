name: BIGGER OVERLAY V2 - GERAR APK
on:
  push:
    paths:
      - 'bigger-float/**'
      - '.github/workflows/bigger-float.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Gerar APK
        working-directory: bigger-float
        run: gradle assembleDebug --stacktrace
      - name: Renomear APK
        run: cp bigger-float/app/build/outputs/apk/debug/app-debug.apk BIGGER-OVERLAY-v2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BIGGER-OVERLAY-v2
          path: BIGGER-OVERLAY-v2.apk
