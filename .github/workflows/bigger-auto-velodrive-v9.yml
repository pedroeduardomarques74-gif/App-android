name: "BIGGER AUTO VELODRIVE v9"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "Motorista-Top-X.apk"
      - ".github/workflows/bigger-auto-velodrive-v9.yml"

permissions:
  contents: read

jobs:
  rebuild:
    name: "Recompilar VeloDrive Pro X"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar APK original
        shell: bash
        run: |
          set -euo pipefail
          test -f "Motorista-Top-X.apk" || {
            echo "::error::Envie o APK original para a raiz do repositorio com o nome Motorista-Top-X.apk"
            exit 1
          }
          unzip -t "Motorista-Top-X.apk" >/dev/null

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Baixar APKTool
        shell: bash
        run: |
          set -euo pipefail
          URL="$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r '.assets[] | select(.name | test("^apktool_.*\\.jar$")) | .browser_download_url' | head -n1)"
          test -n "$URL" && test "$URL" != "null"
          curl -fL "$URL" -o apktool.jar
          java -jar apktool.jar --version

      - name: Decodificar APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf velodrive_work
          java -jar apktool.jar d -f "Motorista-Top-X.apk" -o velodrive_work

      - name: Aplicar marca VeloDrive Pro X
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("velodrive_work")
          manifest = root / "AndroidManifest.xml"
          txt = manifest.read_text(encoding="utf-8", errors="replace")

          m = re.search(r'android:label="(@string/([^"]+)|[^"]*)"', txt)
          label_key = None
          if m:
              if m.group(2):
                  label_key = m.group(2)
              else:
                  txt = txt[:m.start()] + txt[m.start():m.end()].replace(m.group(1), "VeloDrive Pro X") + txt[m.end():]

          txt = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/velodrive_launcher"', txt, count=1)
          if 'android:roundIcon=' in txt:
              txt = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/velodrive_launcher"', txt, count=1)

          manifest.write_text(txt, encoding="utf-8")

          if label_key:
              for p in root.glob("res/values*/strings.xml"):
                  try:
                      s = p.read_text(encoding="utf-8", errors="replace")
                  except Exception:
                      continue
                  pat = re.compile(r'(<string\\s+name="' + re.escape(label_key) + r'"[^>]*>)(.*?)(</string>)', re.S)
                  ns, n = pat.subn(r'\\1VeloDrive Pro X\\3', s)
                  if n:
                      p.write_text(ns, encoding="utf-8")

          for p in root.glob("res/values*/strings.xml"):
              try:
                  s = p.read_text(encoding="utf-8", errors="replace")
              except Exception:
                  continue
              s2 = s.replace(">Motorista Top X<", ">VeloDrive Pro X<")
              if s2 != s:
                  p.write_text(s2, encoding="utf-8")
          PY

          mkdir -p velodrive_work/res/drawable
          cat > velodrive_work/res/drawable/velodrive_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#07111F" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#00D4FF" android:pathData="M18,24 L37,24 L54,65 L71,24 L90,24 L62,84 L46,84 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M70,68 L88,68 L88,75 L70,75 Z"/>
          </vector>
          XML

      - name: Recompilar
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar b velodrive_work -o VeloDrive-Pro-X-unsigned.apk
          unzip -t VeloDrive-Pro-X-unsigned.apk >/dev/null

      - name: Ferramentas Android
        shell: bash
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"

      - name: Gerar certificado de assinatura
        shell: bash
        run: |
          set -euo pipefail
          openssl genrsa -out velodrive-key.pem 4096
          openssl req -new -x509 -key velodrive-key.pem -out velodrive-cert.pem -days 3650 -subj "/CN=VeloDrive Pro X/O=BIGGER/C=BR"

      - name: Alinhar e assinar
        shell: bash
        run: |
          set -euo pipefail
          "$BUILD_TOOLS/zipalign" -f -p 4 VeloDrive-Pro-X-unsigned.apk VeloDrive-Pro-X.apk
          "$BUILD_TOOLS/apksigner" sign             --key velodrive-key.pem             --cert velodrive-cert.pem             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             VeloDrive-Pro-X.apk
          "$BUILD_TOOLS/zipalign" -c -v 4 VeloDrive-Pro-X.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs VeloDrive-Pro-X.apk
          unzip -t VeloDrive-Pro-X.apk >/dev/null
          sha256sum VeloDrive-Pro-X.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: VeloDrive-Pro-X-APK
          path: VeloDrive-Pro-X.apk
          if-no-files-found: error
          retention-days: 30
