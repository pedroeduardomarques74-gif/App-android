name: M3U Extractor APK
on:
  push:
    branches: [m3u-extractor-pro]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDK="$ANDROID_HOME"
          if [ -z "$SDK" ]; then SDK="$HOME/android-sdk"; fi
          mkdir -p "$SDK/cmdline-tools"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/sdk.zip
            unzip -q /tmp/sdk.zip -d /tmp/android-tools
            mv /tmp/android-tools/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "sdk.dir=$SDK" > m3u-extractor/local.properties
      - name: Build signed debug APK
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --no-daemon -p m3u-extractor assembleDebug
          cp m3u-extractor/app/build/outputs/apk/debug/app-debug.apk M3U-Extractor-Pro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: M3U-Extractor-Pro
          path: M3U-Extractor-Pro.apk
