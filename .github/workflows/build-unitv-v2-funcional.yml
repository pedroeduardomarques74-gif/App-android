name: "UniTV V2 Funcional - APK"
on:
  workflow_dispatch:
  push:
    branches: [unitv-v2]
    paths:
      - 'v2/**'
      - '.github/workflows/build-unitv-v2-funcional.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build V2
        working-directory: v2
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp v2/app/build/outputs/apk/debug/app-debug.apk UniTV-V2-FUNCIONAL.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UniTV-V2-FUNCIONAL-APK
          path: UniTV-V2-FUNCIONAL.apk
          retention-days: 30
