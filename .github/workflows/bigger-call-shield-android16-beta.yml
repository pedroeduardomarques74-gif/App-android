name: BIGGER CALL SHIELD PRO - APK
on:
  push:
    branches: [bigger-call-shield-android16-beta]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Create isolated Android project
        shell: bash
        run: |
          mkdir -p shieldapp/app/src/main/java/com/bigger/callshield
          cd shieldapp
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='BiggerCallShield'
          include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.bigger.callshield'
            compileSdk 35
            defaultConfig { applicationId 'com.bigger.callshield'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0-beta' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="BIGGER Call Shield" android:theme="@android:style/Theme.Material.NoActionBar" android:allowBackup="false">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <service android:name=".CallService" android:label="BIGGER Call Shield" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="false">
                <intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter>
              </service>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/bigger/callshield/CallService.java <<'EOF'
          package com.bigger.callshield;
          import android.app.*;
          import android.service.notification.*;
          import android.content.*;
          import java.util.*;
          import java.text.Normalizer;
          public class CallService extends NotificationListenerService {
            static String normalize(String s) {
              if(s==null)return "";
              return Normalizer.normalize(s.trim(),Normalizer.Form.NFD).replaceAll("\\p{M}","").toLowerCase(Locale.ROOT).replaceAll("\\s+"," ");
            }
            public void onNotificationPosted(StatusBarNotification sbn) {
              if(sbn==null)return;
              android.content.SharedPreferences p=getSharedPreferences("shield",0);
              if(!p.getBoolean("enabled",false))return;
              String pkg=sbn.getPackageName();
              if(!("com.whatsapp".equals(pkg)&&p.getBoolean("wa",true) || "com.whatsapp.w4b".equals(pkg)&&p.getBoolean("biz",false)))return;
              if(p.getBoolean("schedule",false)) {
                Calendar c=Calendar.getInstance();int now=c.get(Calendar.HOUR_OF_DAY)*60+c.get(Calendar.MINUTE);
                int start=p.getInt("from",22)*60,end=p.getInt("to",7)*60;
                if(start!=end && !(start<end?now>=start&&now<end:now>=start||now<end))return;
              }
              Notification n=sbn.getNotification();
              if(n==null||!Notification.CATEGORY_CALL.equals(n.category)||n.actions==null||n.extras==null)return;
              CharSequence label=n.extras.getCharSequence(Notification.EXTRA_TITLE);
              String caller=label==null?"":label.toString();
              if(caller.trim().isEmpty())return;
              for(String allowed:p.getStringSet("allowed",Collections.emptySet()))if(normalize(allowed).equals(normalize(caller)))return;
              for(Notification.Action a:n.actions) {
                String title=normalize(a.title==null?"":a.title.toString());
                if((title.equals("recusar")||title.equals("rejeitar")||title.equals("decline")||title.equals("reject")||title.equals("desligar")||title.equals("hang up"))&&a.actionIntent!=null){
                  try { a.actionIntent.send();log(p,caller+" • recusa solicitada"); }
                  catch(PendingIntent.CanceledException|SecurityException ex){log(p,caller+" • falha na acao");}
                  return;
                }
              }
              log(p,caller+" • sem botao de recusar");
            }
            void log(android.content.SharedPreferences p,String s) {
              String old=p.getString("log","");
              p.edit().putString("log",(new java.text.SimpleDateFormat("dd/MM HH:mm",Locale.getDefault()).format(new Date())+" • "+s+"\n"+old).substring(0,Math.min(5000,(new java.text.SimpleDateFormat("dd/MM HH:mm",Locale.getDefault()).format(new Date())+" • "+s+"\n"+old).length()))).apply();
            }
          }
          EOF
          cat > app/src/main/java/com/bigger/callshield/MainActivity.java <<'EOF'
          package com.bigger.callshield;
          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.*;
          import android.graphics.drawable.*;
          import android.view.*;
          import android.widget.*;
          import java.util.*;
          public class MainActivity extends Activity {
            int bg=0xff091320,panel=0xff15283c,green=0xff59e5ae,muted=0xffabc0d1;
            android.content.SharedPreferences p;
            LinearLayout root,body;
            int dp(int x){return (int)(x*getResources().getDisplayMetrics().density+.5f);}
            TextView txt(String s,int sz,int color){TextView t=new TextView(this);t.setText(s);t.setTextSize(sz);t.setTextColor(color);return t;}
            LinearLayout card(String heading) {
              LinearLayout a=new LinearLayout(this);a.setOrientation(1);a.setPadding(dp(17),dp(17),dp(17),dp(17));
              GradientDrawable d=new GradientDrawable();d.setColor(panel);d.setCornerRadius(dp(18));a.setBackground(d);
              LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,-2);lp.bottomMargin=dp(16);body.addView(a,lp);
              TextView h=txt(heading,17,green);h.setTypeface(null,1);a.addView(h);return a;
            }
            void toggle(LinearLayout c,String label,String key,boolean def) {
              Switch s=new Switch(this);s.setText(label);s.setTextColor(-1);s.setTextSize(15);s.setPadding(0,dp(12),0,dp(12));
              s.setChecked(p.getBoolean(key,def));s.setOnCheckedChangeListener((v,checked)->p.edit().putBoolean(key,checked).apply());c.addView(s);
            }
            void label(LinearLayout c,String s){TextView t=txt(s,13,muted);t.setPadding(0,dp(8),0,dp(8));c.addView(t);}
            Button button(String name){Button b=new Button(this);b.setText(name);b.setAllCaps(false);b.setTextColor(bg);b.setBackgroundTintList(android.content.res.ColorStateList.valueOf(green));return b;}
            public void onCreate(Bundle b){super.onCreate(b);p=getSharedPreferences("shield",0);show();}
            void show(){
              ScrollView scroll=new ScrollView(this);scroll.setBackgroundColor(bg);setContentView(scroll);
              body=new LinearLayout(this);body.setOrientation(1);body.setPadding(dp(17),dp(25),dp(17),dp(25));scroll.addView(body);
              TextView head=txt("⬡ BIGGER CALL SHIELD",24,-1);head.setTypeface(null,1);body.addView(head);
              label(body,"PRO • Central de chamadas WhatsApp");
              LinearLayout c=card("PROTEÇÃO INTELIGENTE");toggle(c,"Rejeição automática ativada","enabled",false);
              label(c,"Rejeita somente quando o WhatsApp disponibiliza uma ação Recusar na notificação.");
              Button permission=button("Permitir acesso às notificações");permission.setOnClickListener(v->startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS")));c.addView(permission);
              c=card("APLICATIVOS");toggle(c,"WhatsApp normal","wa",true);toggle(c,"WhatsApp Business","biz",false);
              c=card("AGENDAMENTO");toggle(c,"Usar horário programado","schedule",false);
              label(c,"Horário inicial / final");
              LinearLayout times=new LinearLayout(this);c.addView(times);
              Spinner start=hour(p.getInt("from",22)),end=hour(p.getInt("to",7));
              times.addView(start,new LinearLayout.LayoutParams(0,dp(52),1));times.addView(end,new LinearLayout.LayoutParams(0,dp(52),1));
              start.setOnItemSelectedListener(listener("from"));end.setOnItemSelectedListener(listener("to"));
              c=card("CONTATOS PERMITIDOS");label(c,"Informe exatamente o nome exibido na chamada.");
              EditText name=new EditText(this);name.setSingleLine(true);name.setTextColor(-1);name.setHintTextColor(muted);name.setHint("Nome do contato");c.addView(name);
              Button add=button("Adicionar exceção");c.addView(add);
              LinearLayout entries=new LinearLayout(this);entries.setOrientation(1);c.addView(entries);
              Runnable update=()->{
                entries.removeAllViews();
                ArrayList<String> names=new ArrayList<>(p.getStringSet("allowed",Collections.emptySet()));Collections.sort(names);
                for(String item:names){LinearLayout line=new LinearLayout(this);line.setGravity(Gravity.CENTER_VERTICAL);entries.addView(line);
                  TextView t=txt("✓ "+item,15,-1);line.addView(t,new LinearLayout.LayoutParams(0,dp(48),1));
                  Button remove=button("Remover");line.addView(remove);remove.setOnClickListener(v->{Set<String>s=new HashSet<>(p.getStringSet("allowed",Collections.emptySet()));s.remove(item);p.edit().putStringSet("allowed",s).apply();show();});}
              };update.run();
              add.setOnClickListener(v->{String s=name.getText().toString().trim();if(s.isEmpty())return;Set<String> a=new HashSet<>(p.getStringSet("allowed",Collections.emptySet()));a.add(s);p.edit().putStringSet("allowed",a).apply();name.setText("");update.run();});
              c=card("HISTÓRICO");label(c,"Registro de tentativas; não comprova encerramento de chamada.");
              label(c,p.getString("log","Sem registros até agora."));
              Button clear=button("Limpar histórico");c.addView(clear);clear.setOnClickListener(v->{p.edit().remove("log").apply();show();});
              label(body,"BETA • Funcionalidade depende de ações disponibilizadas pelo WhatsApp. Não bloqueia mensagens. Não solicita acesso a conversas.");
            }
            Spinner hour(int value){Spinner s=new Spinner(this);String[] arr=new String[24];for(int i=0;i<24;i++)arr[i]=String.format(Locale.ROOT,"%02d:00",i);ArrayAdapter<String>a=new ArrayAdapter<>(this,android.R.layout.simple_spinner_dropdown_item,arr);s.setAdapter(a);s.setSelection(value);return s;}
            AdapterView.OnItemSelectedListener listener(String key){return new AdapterView.OnItemSelectedListener(){public void onItemSelected(AdapterView<?> p1,View v,int pos,long id){p.edit().putInt(key,pos).apply();}public void onNothingSelected(AdapterView<?> p1){}};}
          }
          EOF
      - name: Compile APK
        run: cd shieldapp && gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BIGGER-CALL-SHIELD-APK
          path: shieldapp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
