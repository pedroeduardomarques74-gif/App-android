<!doctype html><html lang='pt-BR'><head><meta name='viewport' content='width=device-width,initial-scale=1'><style>body{margin:0;background:linear-gradient(#103b20,#071b10);color:#fff;font-family:Arial;padding:22px}.top{font-size:30px;font-weight:800;margin-bottom:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button{background:#173d2a;color:#fff;border:1px solid #3b7154;border-radius:10px;padding:12px 18px;font-size:16px}.card{background:#0c2a1b;border:1px solid #2e6144;border-radius:16px;padding:16px;margin:12px 0}.league{color:#8fd7a8;font-weight:700}.row{display:flex;justify-content:space-between;gap:16px;font-size:20px;margin-top:8px}.meta{color:#d7efe0;margin-top:8px}.err{padding:30px;text-align:center}</style></head><body><div class='top'>⚽ GUIA DE JOGOS</div><div class='tabs' id='tabs'></div><main id='c'><div class='err'>Carregando jogos...</div></main><script>const L=[['bra.1','Brasileirão'],['eng.1','Premier League'],['esp.1','La Liga'],['uefa.champions','Champions']];let cur=L[0];function tabs(){let e=document.getElementById('tabs');e.innerHTML='';L.forEach(x=>{let b=document.createElement('button');b.textContent=x[1];b.onclick=()=>{cur=x;load()};e.appendChild(b)})}function tm(x){try{return new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'}).format(new Date(x))}catch(e){return ''}}async function load(){c.innerHTML='<div class=err>Carregando...</div>';try{let d=new Date(),y=d.getFullYear(),m=('0'+(d.getMonth()+1)).slice(-2),da=('0'+d.getDate()).slice(-2),u='https://site.api.espn.com/apis/site/v2/sports/soccer/'+cur[0]+'/scoreboard?dates='+y+m+da+'&limit=200',j=await fetch(u).then(r=>r.json()),ev=j.events||[];c.innerHTML=ev.length?'':'<div class=err>Nenhum jogo hoje.</div>';ev.forEach(e=>{let q=e.competitions&&e.competitions[0]||{},cs=q.competitors||[],h=cs.find(z=>z.homeAway==='home')||cs[0]||{},a=cs.find(z=>z.homeAway==='away')||cs[1]||{},s=(q.status&&q.status.type&&q.status.type.shortDetail)||'A confirmar',x=document.createElement('section');x.className='card';x.innerHTML='<div class=league>'+cur[1]+'</div><div class=row><b>'+((h.team||{}).displayName||'Mandante')+'</b><b>'+tm(e.date)+'</b><b>'+((a.team||{}).displayName||'Visitante')+'</b></div><div class=meta>'+s+' • Canal: a confirmar</div>';c.appendChild(x)})}catch(e){c.innerHTML='<div class=err>Não foi possível carregar os jogos.</div>'}}tabs();load();</script></body></html>
